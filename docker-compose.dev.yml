# =============================================================================
# Fatigue Analysis Tool — Development Docker Compose Override
#
# Hot-reloading Next.js app with source code mounted from host.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# The web app source (apps/web/src) is mounted for instant hot-reloading.
# Changes to shared packages (types, core, data, ui) require a rebuild:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml build
# =============================================================================

services:
  fatigue-web:
    build:
      target: build  # Use build stage (has all deps + built packages)
    image: fatigue/fatigue-web:dev
    environment:
      - NODE_ENV=development
    volumes:
      # Mount web app source for hot-reloading via Turbopack
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./apps/web/next.config.js:/app/apps/web/next.config.js
      - ./apps/web/tailwind.config.ts:/app/apps/web/tailwind.config.ts
      - ./apps/web/postcss.config.js:/app/apps/web/postcss.config.js
      # Shared package source (changes require package rebuild for dist/)
      - ./packages/types/src:/app/packages/types/src
      - ./packages/core/src:/app/packages/core/src
      - ./packages/data/src:/app/packages/data/src
      - ./packages/ui/src:/app/packages/ui/src
      # Reference data (read-only)
      - ./data/reference:/app/data/reference:ro
      # Persist saved analyses across restarts
      - fatigue-analyses:/app/data/analyses
      # Config files
      - ./tsconfig.base.json:/app/tsconfig.base.json
      - ./.eslintrc.json:/app/.eslintrc.json
      - ./.prettierrc:/app/.prettierrc
    command: sh -c "pnpm dev"
