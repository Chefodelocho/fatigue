# =============================================================================
# Fatigue Analysis Tool — Docker Compose
#
# Provides:
#   - Development: Hot-reloading Next.js app (ports: 3000)
#   - Production:  Optimized build served via standalone server
#
# Usage:
#   docker compose up -d              # Production mode
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d  # Dev
# =============================================================================

services:
  fatigue-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: fatigue/fatigue-web:latest
    container_name: fatigue-web
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Session cookie secret for cookie-dependent caching
      - SESSION_COOKIE_SECRET=${SESSION_COOKIE_SECRET:-change-me-in-production}
    volumes:
      # Mount reference data for runtime access
      - ./data/reference:/app/data/reference:ro
      # Persist saved analyses across container restarts
      - fatigue-analyses:/app/data/analyses
    restart: unless-stopped
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - fatigue-network

networks:
  fatigue-network:
    driver: bridge

volumes:
  fatigue-analyses:
    driver: local
